name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# least privilege: the job only reads the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      # Dedicated, throw-away PostgreSQL 17 for the integration tests (dummy credentials, job-local).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dummy value for this job only. The integration suite creates/drops its own `pantau_test` database.
      PANTAU_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # pnpm version comes from the `packageManager` field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Versions
        run: |
          node --version
          pnpm --version
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client(process.env.PANTAU_TEST_ADMIN_URL);await c.connect();console.log((await c.query('select version()')).rows[0].version);await c.end()})()"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  # Browser tests of the web app against the real API and PostgreSQL 17. Separate job so the backend gate above stays unchanged.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PANTAU_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @pantau/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @pantau/web build

      - name: Browser E2E
        run: pnpm test:e2e
